version: 2
updates:
  # Update the frontend and manual npm dependencies.
  - package-ecosystem: "npm"
    directory: "/izanami-frontend"
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: "daily"
    # Increase package.json requirements and keep package-lock.json in sync.
    versioning-strategy: "increase"
    # Keep the default limit of 5 open version PRs, including individual majors.
    groups:
      # Major updates stay outside this group and get individual PRs.
      minor-and-patches:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Group development security updates; production security updates stay individual.
      development-security:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/manual"
    # Check for updates every Monday (the default weekly day).
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    groups:
      minor-and-patches:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      development-security:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - "*"
