# Allow PR creation on weekdays when the Scala Steward instance runs.
pullRequests.frequency = "0 0 ? * MON-FRI"

# Group minor/patch updates; unmatched major updates get individual PRs.
pullRequests.grouping = [
  { name = "patches and minors", "title" = "Patch / minor backend updates", "filter" = [{"version" = "patch"}, {"version" = "minor"}] }
]